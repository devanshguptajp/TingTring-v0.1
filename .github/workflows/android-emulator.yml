name: TTT Android Emulator Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-emulator.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Launch Android emulator and verify app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.tingtring.talk
            adb shell am start -n com.tingtring.talk/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q "com.tingtring.talk/.MainActivity"
            adb shell pidof com.tingtring.talk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tingtring-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
