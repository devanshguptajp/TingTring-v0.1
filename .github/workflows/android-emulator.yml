name: TTT Android Emulator Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-emulator.yml"

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify build toolchain
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --refresh-dependencies --stacktrace --warning-mode=all :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Launch Android emulator and verify app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim"
          script: |
            adb wait-for-device
            for i in $(seq 1 60); do
              if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.tingtring.talk
            adb shell cmd package resolve-activity --brief com.tingtring.talk | grep -q 'com.tingtring.talk/.MainActivity'
            adb shell am force-stop com.tingtring.talk
            adb shell am start -W -n com.tingtring.talk/.MainActivity
            sleep 5
            adb shell pidof com.tingtring.talk
            adb shell dumpsys activity activities | grep -q 'com.tingtring.talk/.MainActivity'
            if adb logcat -d -t 400 | grep -E 'FATAL EXCEPTION|Process: com.tingtring.talk' | grep -q .; then
              echo "Application crash detected in logcat"
              adb logcat -d -t 400
              exit 1
            fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tingtring-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
